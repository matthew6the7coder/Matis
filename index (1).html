<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matis – My Personal AI</title>
<style>
  :root { --bg: #f4f1ff; --card: #ffffff; --text: #1f1b33; --accent: #6c4cf1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14122a; --card: #1f1c3a; --text: #f1eeff; --accent: #9d86ff; }
  }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { color: var(--accent); font-size: 2.4rem; margin-bottom: 4px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px 20px; margin-top: 16px; }
  code { background: rgba(108, 76, 241, 0.15); padding: 2px 6px; border-radius: 6px; }
  a.button { display: inline-block; background: var(--accent); color: #fff; padding: 10px 18px;
             border-radius: 10px; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Matis</h1>
  <p>My personal AI helper for my projects. Free, with no credits.</p>

  <div class="card">
    <h2>How to run Matis</h2>
    <ol>
      <li>Install <a href="https://ollama.com">Ollama</a></li>
      <li>Run <code>ollama pull llama3.2:1b</code></li>
      <li>Run <code>pip install ollama</code></li>
      <li>Run <code>python chatbot.py</code></li>
    </ol>
  </div>

  <div class="card">
    <h2>Get the code</h2>
    <p>Matis is open for anyone to read and try.</p>
    <a class="button" href="https://github.com/matthew6the7coder/Matis">View on GitHub</a>
  </div>
</main>
</body>
</html>
